{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<main>
  <!-- Page Hero Section -->
  <section class="page-hero" id="page-hero">
    <div class="container">
      <div class="page-hero-content">
        <h1>{{ page.title }}</h1>
        {% if page.intro %}
          <p class="page-intro">{{ page.intro }}</p>
        {% endif %}
      </div>
    </div>
  </section>

  <!-- Featured Image -->
  {% if page.featured_image %}
    <section class="page-featured-image">
      <div class="container">
        <img src="{{ page.featured_image.url }}" alt="{{ page.featured_image.alt }}" class="featured-img">
      </div>
    </section>
  {% endif %}

  <!-- Page Body Content -->
  {% if page.body %}
    <section class="page-body" id="page-body">
      <div class="container">
        <div class="page-content">
          {{ page.body|richtext }}
        </div>
      </div>
    </section>
  {% endif %}
</main>
{% endblock %}
